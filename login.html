<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MAZ Tools</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
        }

        .login-card {
            width: min(420px, 100%);
            padding: 35px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .login-card h1 {
            margin-bottom: 10px;
        }

        .login-card > p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .login-card label {
            display: block;
            margin: 15px 0 6px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            color: white;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .login-card button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-card .notice {
            font-size: 12px;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <a href="index.html" class="logo">MAZ<span>Tools</span></a>

            <h1>Welcome Back</h1>
            <p>Sign in to your MAZ Tools account.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <p class="notice" id="message">
                Account login is not connected yet.
            </p>

            <p><a href="index.html">← Back to Home</a></p>
        </section>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();
            document.getElementById("message").textContent =
                "Login is not connected yet. Please configure account authentication first.";
        });
    </script>
</body>
</html>
